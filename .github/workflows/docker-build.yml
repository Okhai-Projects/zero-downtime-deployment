name: Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Version 1
        run: docker build -t zero-downtime-v1 ./app/v1

      - name: Build Version 2
        run: docker build -t zero-downtime-v2 ./app/v2